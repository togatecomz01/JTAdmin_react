<!doctype html>
<html lang="ko">
<head>
	<title>JT 저축은행 관리자</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta charset="utf-8">
	<link rel="stylesheet" href="./public/css/reset.css">
	<link rel="stylesheet" href="./public/css/common.css">

	<script src="./public/js/jquery.min.js"></script>
	<script src="./public/js/common.js"></script>
</head>
<body>
	
<div id="lognWrap" class="Wrap-In" style="overflow-y:hidden;" >
	<dl>
		<dt>
			<h1><img src="./public/img/common/logo_color.png" alt="제이티저축은행"></h1>
			<p>안녕하세요, JT저축은행 관리자 홈페이지입니다.</p>
		</dt>
		<dd>
			<input type="text" name="" placeholder="아이디">
			<input type="password" name="" placeholder="비밀번호">

			<!-- 필수값 미입력시 class active추가시 노출-->
			<p class="required active">아이디 또는 비밀번호가 잘못 입력되었습니다.</p>
		</dd>
		<dd>
			<button type="button">로그인</button>
			<p>※ 아이디 / 비밀번호를 분실했을 경우 전산팀으로 연락하시기 바랍니다.</p>
		</dd>
	</dl>
</div>
</body>
</html>
